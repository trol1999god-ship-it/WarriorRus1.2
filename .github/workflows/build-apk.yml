name: Build Рабочая карта APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'feature/**', 'codex/**' ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rabochaya-karta-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rabochaya-karta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
