name: Independent core Android QA
on:
  workflow_dispatch:
  push:
    branches: [codex/independent-core-auto]
    paths: ['independent-core/**', '.github/workflows/independent-core-qa.yml']
permissions:
  contents: read
concurrency:
  group: independent-core-${{ github.ref }}${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[map-edit-api37-qa]') || contains(github.event.head_commit.message, '[core-api37-qa]')) && '-api37' || github.event_name == 'push' && contains(github.event.head_commit.message, '[object-formats-qa]') && '-formats' || github.event_name == 'push' && contains(github.event.head_commit.message, '[ozf2-qa]') && '-ozf2' || '' }}${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-display-qa]') && '-reference-display' || '' }}${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-ungroup-qa]') && '-ungroup' || '' }}
  # Finish the current Android matrix before testing the newest pending push.
  cancel-in-progress: false
jobs:
  # The branch push checks are visible in PR #14 without a second run.
  # Evidence-only runs validate their changed-file allowlist and read an old artifact;
  # they are not new build/test acceptance and cannot contain application changes.
  recover-saved-evidence:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[evidence-only]')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Read original DEM timeout diagnostics without rerunning tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 independent-core/ci/recover_saved_evidence.py --case dem --api ${{ matrix.api }} --out "$RUNNER_TEMP/recovered-${{ matrix.api }}"
  jvm:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[evidence-only]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 ci/test_run_android_checks.py
        working-directory: independent-core
      - run: python3 migration/test_project_backup.py
        working-directory: independent-core
      - run: python3 security/privacy_audit.py --report "$RUNNER_TEMP/source-privacy.json"
        working-directory: independent-core
      - run: python3 owned-projects/verify_jvm.py
        working-directory: independent-core
      - name: Keep unit and source-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-unit-source-quality
          path: |
            ${{ runner.temp }}/source-privacy.json
            independent-core/security/jvm-current.json
          if-no-files-found: warn
          retention-days: 7
  android:
    needs: jvm
    runs-on: ubuntu-22.04
    # API 35 reached maplayers after the previous 45-minute job budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-display-api35-qa]') && '[{"api":35,"arch":"x86_64","target":"google_apis"}]' || github.event_name == 'push' && (contains(github.event.head_commit.message, '[acceptance-resume]') || contains(github.event.head_commit.message, '[preliminary-acceptance]') || contains(github.event.head_commit.message, '[map-ui-qa]') || contains(github.event.head_commit.message, '[reference-display-qa]') || contains(github.event.head_commit.message, '[reference-menu-qa]') || contains(github.event.head_commit.message, '[reference-files-qa]') || contains(github.event.head_commit.message, '[reference-icons-ozi-qa]') || contains(github.event.head_commit.message, '[ozf2-qa]')) && '[{"api":23,"arch":"x86","target":"default"},{"api":35,"arch":"x86_64","target":"google_apis"},{"api":37,"image":"37.0","arch":"x86_64","target":"google_apis"}]' || github.event_name == 'push' && contains(github.event.head_commit.message, '[core-api37-qa]') && '[{"api":37,"image":"37.0","arch":"x86_64","target":"google_apis"}]' || github.event_name == 'push' && contains(github.event.head_commit.message, '[transfer-integrity-qa]') && '[{"api":23,"arch":"x86","target":"default"},{"api":35,"arch":"x86_64","target":"google_apis"},{"api":37,"image":"37.0","arch":"x86_64","target":"google_apis_ps16k"}]' || github.event_name == 'push' && contains(github.event.head_commit.message, '[map-edit-api37-qa]') && '[{"api":37,"image":"37.0","arch":"x86_64","target":"google_apis"}]' || github.event_name == 'push' && contains(github.event.head_commit.message, '[map-edit-draft-qa]') && '[{"api":23,"arch":"x86","target":"default"},{"api":35,"arch":"x86_64","target":"google_apis"},{"api":37,"image":"37.0","arch":"x86_64","target":"google_apis"}]' || github.event_name == 'push' && contains(github.event.head_commit.message, '[wide-map-qa]') && '[{"api":35,"arch":"x86_64","target":"google_apis"}]' || '[{"api":23,"arch":"x86","target":"default"},{"api":35,"arch":"x86_64","target":"google_apis"}]') }}
    defaults:
      run:
        working-directory: independent-core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-23" "build-tools;35.0.0" "cmdline-tools;12.0"'
      - name: Compile own application and instrumentation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rk-quality"
          python3 ci/build_android_qa.py --sdk "$ANDROID_HOME" --tools "$RUNNER_TEMP/rk-tools" --out "$RUNNER_TEMP/rk-qa" --debug --skip-jvm 2>&1 | tee "$RUNNER_TEMP/rk-quality/build.log"
      - name: Audit the built APK (custom privacy checks, not Android lint)
        run: python3 security/privacy_audit.py --apk "$RUNNER_TEMP/rk-qa/app.apk" --report "$RUNNER_TEMP/rk-quality/privacy.json"
      - name: Record the real release-gate attempt (no publication)
        run: python3 ci/check_release_profile.py --sdk "$ANDROID_HOME" --tools "$RUNNER_TEMP/rk-tools" --out "$RUNNER_TEMP/rk-quality/release"
      - name: Run official Android lint
        run: python3 ci/android_lint_status.py --sdk "$ANDROID_HOME" --apk "$RUNNER_TEMP/rk-qa/app.apk" --report "$RUNNER_TEMP/rk-quality/android-lint-support.json"
      - name: Require hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Use an avdmanager that recognizes versioned Android 17 images
        if: ${{ matrix.api == 37 }}
        run: |
          sdk_tools="$ANDROID_HOME/cmdline-tools"
          "$sdk_tools/latest/bin/sdkmanager" "cmdline-tools;22.0"
          mv "$sdk_tools/latest" "$sdk_tools/runner-default"
          ln -s "22.0" "$sdk_tools/latest"
          test "$("$sdk_tools/latest/bin/sdkmanager" --version | head -n 1)" = 22.0
      - name: Start ADB before the Android 17 cold boot
        if: ${{ matrix.api == 37 }}
        run: '"$ANDROID_HOME/platform-tools/adb" start-server'
      - name: Run Android scenarios
        id: android-scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.image || matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          cores: ${{ matrix.api == 37 && '4' || '2' }}
          ram-size: ${{ matrix.api == 37 && '4096M' || '' }}
          disk-size: ${{ matrix.api == 37 && '6144M' || '' }}
          emulator-options: ${{ matrix.api == 37 && '-no-window -gpu software -no-snapshot -noaudio -no-boot-anim' || '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim' }}
          disable-linux-hw-accel: false
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: ${{ matrix.api == 37 && '300' || '600' }}
          working-directory: independent-core
          # Opt-in push profile. Ordinary pushes still execute the full suite.
          script: >-
            ${{ github.event_name == 'push' && matrix.api == 35 && contains(github.event.head_commit.message, '[reference-display-qa]') && 'adb -s emulator-5554 shell settings put secure immersive_mode_confirmations confirmed &&' || '' }}
            ${{ matrix.api == 37 && 'test "$(adb -s emulator-5554 shell getprop ro.build.version.sdk)" = 37 && adb -s emulator-5554 shell wm size 720x900 && adb -s emulator-5554 shell wm density 160 && sleep 20 && adb -s emulator-5554 shell pm path android &&' || '' }}
            ${{ github.event_name == 'push' && matrix.api == 35 && (contains(github.event.head_commit.message, '[acceptance-resume]') || contains(github.event.head_commit.message, '[preliminary-acceptance]') || contains(github.event.head_commit.message, '[map-ui-qa]') || contains(github.event.head_commit.message, '[reference-display-qa]') || contains(github.event.head_commit.message, '[reference-menu-qa]') || contains(github.event.head_commit.message, '[reference-files-qa]') || contains(github.event.head_commit.message, '[transfer-integrity-qa]') || contains(github.event.head_commit.message, '[object-formats-qa]') || contains(github.event.head_commit.message, '[wide-map-qa]') || contains(github.event.head_commit.message, '[fold-feedback-qa]') || (contains(github.event.head_commit.message, '[compact-coordinates-qa]') || contains(github.event.head_commit.message, '[map-edit-draft-qa]'))) && 'adb -s emulator-5554 shell wm size 720x900 && adb -s emulator-5554 shell wm density 160 &&' || '' }}
            python3 ci/run_android_checks.py --keep-going --debug-qa
            ${{ matrix.api == 37 && '--no-streaming' || '' }}
            ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[acceptance-resume]') && '--modes acceptance-resume --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-context-qa]') && '--modes geometrysplit geometryungroup --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-ungroup-qa]') && '--modes geometryungroup --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-grid-style-qa]') && '--modes gridstyle --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-compass-qa]') && '--modes mapcompass --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[preliminary-acceptance]') && '--modes acceptance --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[ozf2-qa]') && '--modes ozf2 --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-icons-ozi-qa]') && '--modes iconlibrary ozidata --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[core-api37-qa]') && '--modes clipboard clipboardreopen objectformats objectformatsreopen --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[object-formats-qa]') && '--modes objectformats objectformatsreopen --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[transfer-integrity-qa]') && '--modes clipboard clipboardreopen --visual-log-modes' || github.event_name == 'push' && (contains(github.event.head_commit.message, '[map-edit-draft-qa]') || contains(github.event.head_commit.message, '[map-edit-api37-qa]')) && '--modes markerlifecycle markerlifecyclereopen --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-providers-qa]') && '--modes cachewrites catalogscreen --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[compact-coordinates-qa]') && '--modes launcher coordinates --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[esri-dns-qa]') && '--modes catalogscreen cachewrites --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[fold-feedback-qa]') && '--modes launcher coordinates cachewrites catalogscreen --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[objects-qa]') && '--modes markerlifecycle markerlifecyclereopen objectmanager objectmanagerreopen managerfilters managerfiltersreopen clipboard clipboardreopen --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[map-layers-qa]') && '--modes launcher coordinates maplayers maplayersreopen --visual-log-modes' || github.event_name == 'push' && (contains(github.event.head_commit.message, '[map-resize-qa]') || contains(github.event.head_commit.message, '[wide-map-qa]')) && '--modes launcher --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-files-qa]') && '--modes launcher managerfilters managerfiltersreopen --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-menu-qa]') && '--modes coordinates launcher --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-display-qa]') && '--modes coordinates --visual-log-modes' || github.event_name == 'push' && contains(github.event.head_commit.message, '[map-ui-qa]') && '--modes launcher coordinates --visual-log-modes' || '--visual-log-modes offlineformats maplayersreopen' }}
            --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554
            --app "$RUNNER_TEMP/rk-qa/app.apk" --tests "$RUNNER_TEMP/rk-qa/tests.apk" --output "$RUNNER_TEMP/rk-results"
            ${{ matrix.api == 37 && '|| { adb -s emulator-5554 logcat -d -t 1800 > "$RUNNER_TEMP/rk-quality/api37-logcat.txt"; exit 1; }' || '' }}
      - name: Package existing synthetic results with exact hashes
        if: ${{ !cancelled() && (steps.android-scenarios.outcome == 'success' || steps.android-scenarios.outcome == 'failure') }}
        id: package-evidence
        env:
          SCENARIO_OUTCOME: ${{ steps.android-scenarios.outcome }}
        run: |
          if [ "$SCENARIO_OUTCOME" = failure ] && [ ! -f "$RUNNER_TEMP/rk-results/results.json" ]; then
            echo "Android scenarios failed before creating results."
            exit 0
          fi
          python3 ci/package_android_evidence.py --source "$RUNNER_TEMP/rk-results" --target "$RUNNER_TEMP/android-evidence.zip" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          echo "archived=true" >> "$GITHUB_OUTPUT"
      - name: Keep synthetic test results
        if: ${{ !cancelled() && steps.package-evidence.outputs.archived == 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: independent-qa-api-${{ matrix.api }}
          path: ${{ runner.temp }}/android-evidence.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Keep isolated QA build and metadata
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: independent-build-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/rk-qa/app.apk
            ${{ runner.temp }}/rk-qa/tests.apk
            ${{ runner.temp }}/rk-qa/qa-build.json
            ${{ runner.temp }}/rk-quality
          if-no-files-found: warn
          retention-days: 7
