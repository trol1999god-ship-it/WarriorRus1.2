name: Independent core Android QA
on:
  workflow_dispatch:
  push:
    branches: [codex/independent-core-auto]
    paths: ['independent-core/**', '.github/workflows/independent-core-qa.yml']
  pull_request:
    paths: ['independent-core/**', '.github/workflows/independent-core-qa.yml']
permissions:
  contents: read
concurrency:
  group: independent-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Codex branch push already validates PR14: do not build the same source twice.
  # Evidence-only runs validate their changed-file allowlist and read an old artifact;
  # they are not new build/test acceptance and cannot contain application changes.
  recover-saved-evidence:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[evidence-only]')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Read original export evidence without rerunning tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 independent-core/ci/recover_saved_evidence.py --api ${{ matrix.api }} --out "$RUNNER_TEMP/recovered-${{ matrix.api }}"
  jvm:
    if: (github.event_name != 'pull_request' || github.head_ref != 'codex/independent-core-auto') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[evidence-only]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 ci/test_run_android_checks.py
        working-directory: independent-core
      - run: python3 security/privacy_audit.py --report "$RUNNER_TEMP/source-privacy.json"
        working-directory: independent-core
      - run: python3 owned-projects/verify_jvm.py
        working-directory: independent-core
      - name: Keep unit and source-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-unit-source-quality
          path: |
            ${{ runner.temp }}/source-privacy.json
            independent-core/security/jvm-current.json
          if-no-files-found: warn
          retention-days: 7
  android:
    needs: jvm
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            arch: x86
            target: default
          - api: 35
            arch: x86_64
            target: google_apis
    defaults:
      run:
        working-directory: independent-core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-23" "build-tools;35.0.0"'
      - name: Compile own application and instrumentation
        run: python3 ci/build_android_qa.py --sdk "$ANDROID_HOME" --tools "$RUNNER_TEMP/rk-tools" --out "$RUNNER_TEMP/rk-qa" --debug --skip-jvm
      - name: Audit the built APK (custom privacy checks, not Android lint)
        run: python3 security/privacy_audit.py --apk "$RUNNER_TEMP/rk-qa/app.apk" --report "$RUNNER_TEMP/rk-quality/privacy.json"
      - name: Record the real release-gate attempt (no publication)
        run: python3 ci/check_release_profile.py --sdk "$ANDROID_HOME" --tools "$RUNNER_TEMP/rk-tools" --out "$RUNNER_TEMP/rk-quality/release"
      - name: Record Android lint integration gap honestly
        run: python3 ci/android_lint_status.py --sdk "$ANDROID_HOME" --report "$RUNNER_TEMP/rk-quality/android-lint-support.json"
      - name: Require hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run Android scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          disable-linux-hw-accel: false
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 600
          working-directory: independent-core
          script: python3 ci/run_android_checks.py --keep-going --debug-qa --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --app "$RUNNER_TEMP/rk-qa/app.apk" --tests "$RUNNER_TEMP/rk-qa/tests.apk" --output "$RUNNER_TEMP/rk-results"
      - name: Keep synthetic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-qa-api-${{ matrix.api }}
          path: ${{ runner.temp }}/rk-results
          if-no-files-found: warn
          retention-days: 7
      - name: Keep isolated QA build and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-build-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/rk-qa/app.apk
            ${{ runner.temp }}/rk-qa/tests.apk
            ${{ runner.temp }}/rk-qa/qa-build.json
            ${{ runner.temp }}/rk-quality
          if-no-files-found: warn
          retention-days: 7
