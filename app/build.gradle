plugins { id "com.android.application" }

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    testOptions { unitTests.includeAndroidResources = true }
    namespace "ru.warriorrus.app"
    compileSdk 35
    defaultConfig {
        applicationId "ru.warriorrus.app"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "2.0-icons"
    }
}


dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    implementation "com.caverock:androidsvg-aar:1.4"
    implementation "org.osmdroid:osmdroid-android:6.1.20"
}

// Keep Robolectric downloads and its lock inside the writable build directory.
tasks.withType(Test).configureEach {
    def testHome = layout.buildDirectory.dir("test-home").get().asFile
    systemProperty "user.home", testHome.absolutePath
    systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"
    doFirst { testHome.mkdirs() }
}
